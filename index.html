function App() {
  const [books, setBooks] = useState(loadBooks);
  const [mainView, setMainView] = useState("index"); // 'index' | 'book'
  const [currentBookId, setCurrentBookId] = useState(null);

  const [quoteSets, setQuoteSets] = useState(loadQuoteSets);
  const [quoteSetView, setQuoteSetView] = useState("index"); // 'index' | 'book'
  const [currentQuoteSetId, setCurrentQuoteSetId] = useState(null);

  const [mainSection, setMainSection] = useState("home"); // 'home' | 'reading' | 'sermon' | 'quotes'

  const SECTION_LABELS_KEY = "reading-summary-section-labels-v1";
  const [sectionLabels, setSectionLabels] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(SECTION_LABELS_KEY));
      return { reading: "독서완료", sermon: "교회설교요약", quotes: "명언", ...(saved || {}) };
    } catch (e) { return { reading: "독서완료", sermon: "교회설교요약", quotes: "명언" }; }
  });
  useEffect(() => {
    try { localStorage.setItem(SECTION_LABELS_KEY, JSON.stringify(sectionLabels)); } catch (e) {}
  }, [sectionLabels]);
  const setSectionLabel = (key, value) => setSectionLabels((prev) => ({ ...prev, [key]: value }));

  const [sermons, setSermons] = useState(() => ensureSundays(loadRawSermons(), new Set(loadDeletedSermonDates())));
  const [deletedSermonDates, setDeletedSermonDates] = useState(loadDeletedSermonDates);
  const [sermonView, setSermonView] = useState("list"); // 'list' | 'detail'
  const [currentSermonId, setCurrentSermonId] = useState(null);
  const [newSermonDate, setNewSermonDate] = useState("");

  // 목록(책/명언/설교) 화면에서 "이 항목이 책갈피"로 지정된 항목 — 화면마다 하나씩만.
  const [bookmarkedBookId, setBookmarkedBookId] = useState(() => { try { return localStorage.getItem("reading-summary-bm-book") || null; } catch (e) { return null; } });
  const [bookmarkedQuoteSetId, setBookmarkedQuoteSetId] = useState(() => { try { return localStorage.getItem("reading-summary-bm-quoteset") || null; } catch (e) { return null; } });
  const [bookmarkedSermonId, setBookmarkedSermonId] = useState(() => { try { return localStorage.getItem("reading-summary-bm-sermon") || null; } catch (e) { return null; } });
  useEffect(() => { try { bookmarkedBookId ? localStorage.setItem("reading-summary-bm-book", bookmarkedBookId) : localStorage.removeItem("reading-summary-bm-book"); } catch (e) {} }, [bookmarkedBookId]);
  useEffect(() => { try { bookmarkedQuoteSetId ? localStorage.setItem("reading-summary-bm-quoteset", bookmarkedQuoteSetId) : localStorage.removeItem("reading-summary-bm-quoteset"); } catch (e) {} }, [bookmarkedQuoteSetId]);
  useEffect(() => { try { bookmarkedSermonId ? localStorage.setItem("reading-summary-bm-sermon", bookmarkedSermonId) : localStorage.removeItem("reading-summary-bm-sermon"); } catch (e) {} }, [bookmarkedSermonId]);
  const toggleBookmarkedBook = (id) => setBookmarkedBookId((cur) => (cur === id ? null : id));
  const toggleBookmarkedQuoteSet = (id) => setBookmarkedQuoteSetId((cur) => (cur === id ? null : id));
  const toggleBookmarkedSermon = (id) => setBookmarkedSermonId((cur) => (cur === id ? null : id));
  const bookListRowRefs = useRef({});
  const quoteSetListRowRefs = useRef({});
  const sermonListRowRefs = useRef({});
  const jumpToBookmarkedBook = () => { const n = bookmarkedBookId && bookListRowRefs.current[bookmarkedBookId]; if (n) n.scrollIntoView({ behavior: "smooth", block: "center" }); };
  const jumpToBookmarkedQuoteSet = () => { const n = bookmarkedQuoteSetId && quoteSetListRowRefs.current[bookmarkedQuoteSetId]; if (n) n.scrollIntoView({ behavior: "smooth", block: "center" }); };
  const jumpToBookmarkedSermon = () => { const n = bookmarkedSermonId && sermonListRowRefs.current[bookmarkedSermonId]; if (n) n.scrollIntoView({ behavior: "smooth", block: "center" }); };

  // 목록 전체를 한 파일로 내려받기/가져오기 (항목마다 시트 하나씩).
  const [bookListFileInputRef, quoteSetListFileInputRef, sermonListFileInputRef] = [useRef(null), useRef(null), useRef(null)];
  const exportBookList = () => XLSX.writeFile(buildMultiItemWorkbook(books), buildFileName("독서완료_전체"));
  const exportQuoteSetList = () => XLSX.writeFile(buildMultiItemWorkbook(quoteSets), buildFileName("명언_전체"));
  const exportSermonList = () => XLSX.writeFile(buildMultiItemWorkbook(sermons.map((s) => ({ title: s.title || s.date, quotes: s.quotes }))), buildFileName("교회설교요약_전체"));
  const importListFile = (file, onDone) => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const items = parseMultiItemWorkbook(evt.target.result, (sheetName, quotes) => ({ sheetName, quotes }));
        if (items.length === 0) { alert("가져올 내용이 없어요."); return; }
        onDone(items);
        alert(`${items.length}개 항목을 가져왔어요.`);
      } catch (err) {
        alert("엑셀 파일을 읽지 못했어요: " + (err.message || err));
      }
    };
    reader.readAsArrayBuffer(file);
  };
  const importBookList = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    importListFile(file, (items) => {
      const now = new Date().toISOString().slice(0, 10);
      setBooks((prev) => [...prev, ...items.map((it) => ({ id: genId(), title: it.sheetName, learnedCount: 0, bookmarkQuoteId: null, readDate: now, quotes: it.quotes }))]);
    });
  };
  const importQuoteSetList = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    importListFile(file, (items) => {
      const now = new Date().toISOString().slice(0, 10);
      setQuoteSets((prev) => [...prev, ...items.map((it) => ({ id: genId(), title: it.sheetName, learnedCount: 0, bookmarkQuoteId: null, readDate: now, quotes: it.quotes }))]);
    });
  };
  const importSermonList = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    importListFile(file, (items) => {
      setSermons((prev) => {
        const existingDates = new Set(prev.map((s) => s.date));
        let cursor = mostRecentSunday(new Date());
        // 이미 있는 날짜와 안 겹치도록, 비어있는 지난 일요일 자리를 하나씩 찾아서 채운다.
        const findFreeDate = () => {
          while (existingDates.has(toDateStr(cursor))) cursor.setDate(cursor.getDate() - 7);
          const ds = toDateStr(cursor);
          existingDates.add(ds);
          cursor.setDate(cursor.getDate() - 7);
          return ds;
        };
        const added = items.map((it) => ({
          id: genId(),
          date: findFreeDate(),
          title: it.sheetName,
          scripture: "",
          preacher: DEFAULT_PREACHER,
          learnedCount: 0,
          bookmarkQuoteId: null,
          quotes: it.quotes,
        }));
        return [...prev, ...added];
      });
    });
  };

  useEffect(() => {
    try { localStorage.setItem(BOOKS_KEY, JSON.stringify(books)); } catch (e) {}
  }, [books]);

  useEffect(() => {
    try { localStorage.setItem(QUOTESETS_KEY, JSON.stringify(quoteSets)); } catch (e) {}
  }, [quoteSets]);

  useEffect(() => {
    try { localStorage.setItem(SERMONS_KEY, JSON.stringify(sermons)); } catch (e) {}
  }, [sermons]);

  useEffect(() => {
    try { localStorage.setItem(DELETED_SERMON_DATES_KEY, JSON.stringify(deletedSermonDates)); } catch (e) {}
  }, [deletedSermonDates]);

  // 실수로 삭제했을 때 되돌리기 위한 실행취소 스택 (최근 5단계).
  const undoStackRef = useRef([]);
  const [undoCount, setUndoCount] = useState(0);
  const pushUndoSnapshot = () => {
    undoStackRef.current = [
      ...undoStackRef.current,
      {
        books: JSON.parse(JSON.stringify(books)),
        quoteSets: JSON.parse(JSON.stringify(quoteSets)),
        sermons: JSON.parse(JSON.stringify(sermons)),
        deletedSermonDates: [...deletedSermonDates],
      },
    ].slice(-5);
    setUndoCount(undoStackRef.current.length);
  };
  const undo = () => {
    const stack = undoStackRef.current;
    if (stack.length === 0) return;
    const last = stack[stack.length - 1];
    undoStackRef.current = stack.slice(0, -1);
    setBooks(last.books);
    setQuoteSets(last.quoteSets || []);
    setSermons(last.sermons);
    setDeletedSermonDates(last.deletedSermonDates || []);
    setUndoCount(undoStackRef.current.length);
  };

  // 화면(목록/상세)을 벗어나면 그 화면에서 쌓인 실행취소 기록은 초기화한다 —
  // 실행취소는 "지금 보고 있는 화면"에서 일어난 일만 되돌릴 수 있게 한다.
  useEffect(() => {
    undoStackRef.current = [];
    setUndoCount(0);
  }, [mainSection, mainView, quoteSetView, sermonView]);

  // 폰을 바꿔도 내용을 그대로 옮길 수 있도록, 앱 전체 데이터를 파일 하나로 백업/복원한다.
  // (브라우저 저장소는 이 기기에만 있어서, 새 기기에서는 이 백업 파일로 불러와야 한다.)
  const fullBackupFileInputRef = useRef(null);
  const exportFullBackup = () => {
    const payload = {
      kind: "reading-summary-full-backup",
      version: 1,
      exportedAt: new Date().toISOString(),
      books,
      quoteSets,
      sermons,
      deletedSermonDates,
      sectionLabels,
      bookmarkedBookId,
      bookmarkedQuoteSetId,
      bookmarkedSermonId,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${sanitizeFileName(sectionLabels.reading || "독서핵심모음집")}_전체백업(${yymmdd()}).json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const importFullBackup = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.kind !== "reading-summary-full-backup") {
          alert("이 앱의 백업 파일이 아니에요.");
          return;
        }
        if (!confirm("지금 있는 모든 내용을 이 백업 파일 내용으로 덮어씁니다. 계속할까요?")) return;
        setBooks(Array.isArray(data.books) ? data.books : []);
        setQuoteSets(Array.isArray(data.quoteSets) ? data.quoteSets : []);
        setSermons(Array.isArray(data.sermons) ? data.sermons : []);
        setDeletedSermonDates(Array.isArray(data.deletedSermonDates) ? data.deletedSermonDates : []);
        if (data.sectionLabels) setSectionLabels((prev) => ({ ...prev, ...data.sectionLabels }));
        setBookmarkedBookId(data.bookmarkedBookId || null);
        setBookmarkedQuoteSetId(data.bookmarkedQuoteSetId || null);
        setBookmarkedSermonId(data.bookmarkedSermonId || null);
        alert("백업 내용을 불러왔어요.");
      } catch (err) {
        alert("백업 파일을 읽지 못했어요: " + (err.message || err));
      }
    };
    reader.readAsText(file);
  };

  // 화면을 열어두고 5분간 움직임(터치/입력 등)이 없으면 화면을 어둡게 꺼서 보여준다.
  // (웹앱은 기기의 실제 화면 밝기/잠금을 직접 끌 수는 없어서, 앱 내용을 검게 가려 "꺼진 것처럼" 만든다.
  //  아무 곳이나 다시 터치하면 켜진다.)
  const [screenOff, setScreenOff] = useState(false);
  useEffect(() => {
    const IDLE_MS = 5 * 60 * 1000;
    let timer = null;
    const resetTimer = () => {
      setScreenOff(false);
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => setScreenOff(true), IDLE_MS);
    };
    const events = ["touchstart", "touchmove", "mousedown", "mousemove", "keydown", "scroll"];
    events.forEach((ev) => window.addEventListener(ev, resetTimer, { passive: true }));
    resetTimer();
    return () => {
      events.forEach((ev) => window.removeEventListener(ev, resetTimer));
      if (timer) clearTimeout(timer);
    };
  }, []);

  // 홈 화면 대제목이 화면 폭에 맞춰 딱 한 줄로 꽉 차도록, 캔버스로 실제 글자 폭을 재서 크기를 계산한다.
  const homeTitleRef = useRef(null);
  const [homeTitleSize, setHomeTitleSize] = useState(28);
  useEffect(() => {
    const el = homeTitleRef.current;
    if (!el || mainSection !== "home") return;
    const BASE = 100; // 측정 기준 크기(크게 잡아야 오차가 덜하다)
    const SAFETY = 0.94; // 폰트 로딩/렌더링 오차에 대비한 여유분
    const measure = () => {
      const parent = el.parentElement;
      if (!parent) return;
      const available = parent.clientWidth;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      ctx.font = `800 ${BASE}px 'Pretendard','Apple SD Gothic Neo',sans-serif`;
      const textWidth = ctx.measureText(el.textContent).width;
      if (textWidth > 0 && available > 0) {
        setHomeTitleSize(Math.floor(BASE * (available / textWidth) * SAFETY));
      }
    };
    measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [mainSection, sectionLabels]);

  const currentBook = books.find((b) => b.id === currentBookId) || null;
  const currentQuoteSet = quoteSets.find((b) => b.id === currentQuoteSetId) || null;
  const currentSermon = sermons.find((s) => s.id === currentSermonId) || null;
  const preacherOptions = Array.from(new Set([DEFAULT_PREACHER, ...sermons.map((s) => s.preacher).filter(Boolean)]));

  const updateBook = (nextBook) => {
    setBooks((prev) => prev.map((b) => (b.id === nextBook.id ? nextBook : b)));
  };
  const renameBook = (title) => {
    if (!currentBook) return;
    updateBook({ ...currentBook, title });
  };

  const updateQuoteSet = (nextSet) => {
    setQuoteSets((prev) => prev.map((b) => (b.id === nextSet.id ? nextSet : b)));
  };
  const renameQuoteSet = (title) => {
    if (!currentQuoteSet) return;
    updateQuoteSet({ ...currentQuoteSet, title });
  };

  const updateSermon = (nextSermon) => {
    setSermons((prev) => prev.map((s) => (s.id === nextSermon.id ? nextSermon : s)));
  };
  const addSermon = () => {
    if (!newSermonDate) return;
    if (sermons.some((s) => s.date === newSermonDate)) {
      alert("이미 그 날짜의 설교가 있어요.");
      return;
    }
    const lastPreacher = sermons.length
      ? sermons.reduce((latest, s) => (s.date > latest.date ? s : latest), sermons[0]).preacher
      : DEFAULT_PREACHER;
    const s = makeSermon(newSermonDate, lastPreacher);
    setSermons((prev) => [...prev, s]);
    setDeletedSermonDates((prev) => prev.filter((d) => d !== newSermonDate));
    setNewSermonDate("");
  };
  const deleteSermon = (id) => {
    pushUndoSnapshot();
    const target = sermons.find((s) => s.id === id);
    if (target) {
      setDeletedSermonDates((prev) => (prev.includes(target.date) ? prev : [...prev, target.date]));
    }
    setSermons((prev) => prev.filter((s) => s.id !== id));
  };

  const [newBookTitle, setNewBookTitle] = useState("");
  const [bookListSearchQuery, setBookListSearchQuery] = useState("");
  const addBook = () => {
    const trimmed = newBookTitle.trim();
    if (!trimmed) return;
    const book = { id: genId(), title: trimmed, learnedCount: 0, bookmarkQuoteId: null, readDate: new Date().toISOString().slice(0, 10), quotes: [] };
    setBooks((prev) => [...prev, book]);
    setNewBookTitle("");
  };

  const deleteBook = (id) => {
    pushUndoSnapshot();
    setBooks((prev) => prev.filter((b) => b.id !== id));
  };

  const [newQuoteSetTitle, setNewQuoteSetTitle] = useState("");
  const [quoteSetListSearchQuery, setQuoteSetListSearchQuery] = useState("");
  const addQuoteSet = () => {
    const trimmed = newQuoteSetTitle.trim();
    if (!trimmed) return;
    const maxNum = quoteSets.reduce((m, s) => Math.max(m, num(s.number) || 0), 0);
    const set = { id: genId(), number: maxNum + 1, title: trimmed, learnedCount: 0, bookmarkQuoteId: null, readDate: new Date().toISOString().slice(0, 10), quotes: [] };
    setQuoteSets((prev) => [...prev, set]);
    setNewQuoteSetTitle("");
  };

  const updateQuoteSetNumber = (id, value) => {
    setQuoteSets((prev) => prev.map((s) => (s.id === id ? { ...s, number: value.trim() === "" ? value : num(value) } : s)));
  };

  const deleteQuoteSet = (id) => {
    pushUndoSnapshot();
    setQuoteSets((prev) => prev.filter((b) => b.id !== id));
  };

  if (mainSection === "home") {
    return (
      <div style={{ minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif" }}>
        {screenOff && <ScreenOffOverlay onWake={() => setScreenOff(false)} />}
        <style>{`
          .field { background:#12151b; border:1px solid #2a303c; border-radius:8px; color:#e7eaf0; padding:6px 8px; font-size:13px; width:100%; }
          .field:focus { outline:none; border-color:#c9974a; }
          .iconbtn { background:none; border:none; cursor:pointer; }
        `}</style>
        <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 22px) 16px 20px" }}>
          <div ref={homeTitleRef} style={{ fontSize: homeTitleSize, fontWeight: 800, marginBottom: 4, whiteSpace: "nowrap", display: "inline-block" }}>📚 독서핵심모음집</div>
          <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 18 }}>아래에서 메뉴를 선택하세요.</div>

          <div
            onClick={() => { setMainSection("reading"); setMainView("index"); }}
            style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "16px 16px", marginBottom: 10, cursor: "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 30 }}>📖</span>
              <div>
                <div style={{ fontSize: 26, fontWeight: 700, color: "#e7eaf0" }}>{sectionLabels.reading}</div>
                <div style={{ fontSize: 12, color: "#8993a6", marginTop: 2 }}>{books.length}권의 책</div>
              </div>
            </div>
            <div style={{ color: "#8993a6", fontSize: 18 }}>›</div>
          </div>

          <div
            onClick={() => setMainSection("sermon")}
            style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "16px 16px", marginBottom: 10, cursor: "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 30 }}>⛪</span>
              <div>
                <div style={{ fontSize: 26, fontWeight: 700, color: "#e7eaf0" }}>{sectionLabels.sermon}</div>
                <div style={{ fontSize: 12, color: "#8993a6", marginTop: 2 }}>{sermons.length}개의 주일 설교</div>
              </div>
            </div>
            <div style={{ color: "#8993a6", fontSize: 18 }}>›</div>
          </div>

          <div
            onClick={() => { setMainSection("quotes"); setQuoteSetView("index"); }}
            style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "16px 16px", cursor: "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 30 }}>{QUOTES_ICON}</span>
              <div>
                <div style={{ fontSize: 26, fontWeight: 700, color: "#e7eaf0" }}>{sectionLabels.quotes}</div>
                <div style={{ fontSize: 12, color: "#8993a6", marginTop: 2 }}>{quoteSets.length}개의 명언 모음</div>
              </div>
            </div>
            <div style={{ color: "#8993a6", fontSize: 18 }}>›</div>
          </div>

          <div style={{ marginTop: 22, paddingTop: 16, borderTop: "1px solid #262c37" }}>
            <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 8 }}>
              폰을 바꾸실 땐, 바꾸기 전에 여기서 백업하고 새 폰에서 복원해주세요.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <input type="file" accept="application/json" ref={fullBackupFileInputRef} onChange={importFullBackup} style={{ display: "none" }} />
              <button
                onClick={exportFullBackup}
                className="iconbtn"
                style={{ flex: 1, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13, borderRadius: 10, padding: "10px 0" }}
              >
                💾 전체 백업
              </button>
              <button
                onClick={() => fullBackupFileInputRef.current && fullBackupFileInputRef.current.click()}
                className="iconbtn"
                style={{ flex: 1, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 13, borderRadius: 10, padding: "10px 0" }}
              >
                📂 전체 복원
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (mainSection === "sermon") {
    return (
      <div style={{ minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif" }}>
        {screenOff && <ScreenOffOverlay onWake={() => setScreenOff(false)} />}
        <style>{`
          .field { background:#12151b; border:1px solid #2a303c; border-radius:8px; color:#e7eaf0; padding:6px 8px; font-size:13px; width:100%; }
          .field:focus { outline:none; border-color:#c9974a; }
          .iconbtn { background:none; border:none; cursor:pointer; }
        `}</style>
        {sermonView === "list" && (
          <SermonListView
            sermons={sermons}
            onOpenSermon={(id) => { setCurrentSermonId(id); setSermonView("detail"); }}
            onAddSermon={addSermon}
            onDeleteSermon={deleteSermon}
            newSermonDate={newSermonDate}
            onChangeNewSermonDate={setNewSermonDate}
            onBackToReading={() => setMainSection("home")}
            undo={undo}
            undoCount={undoCount}
            onImport={importSermonList}
            onExport={exportSermonList}
            fileInputRef={sermonListFileInputRef}
            rowRefs={sermonListRowRefs}
            bookmarkedId={bookmarkedSermonId}
            onToggleBookmark={toggleBookmarkedSermon}
            onJumpToBookmark={jumpToBookmarkedSermon}
            label={sectionLabels.sermon}
            onChangeLabel={(v) => setSectionLabel("sermon", v)}
          />
        )}
        {sermonView === "detail" && currentSermon && (
          <SermonDetailView
            sermon={currentSermon}
            onBack={() => setSermonView("list")}
            onUpdateSermon={updateSermon}
            preacherOptions={preacherOptions}
            onSnapshotUndo={pushUndoSnapshot}
            undo={undo}
            undoCount={undoCount}
          />
        )}
      </div>
    );
  }

  if (mainSection === "quotes") {
    return (
      <div style={{ minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif" }}>
        {screenOff && <ScreenOffOverlay onWake={() => setScreenOff(false)} />}
        <style>{`
          .field { background:#12151b; border:1px solid #2a303c; border-radius:8px; color:#e7eaf0; padding:6px 8px; font-size:13px; width:100%; }
          .field:focus { outline:none; border-color:#c9974a; }
          .iconbtn { background:none; border:none; cursor:pointer; }
        `}</style>

        {quoteSetView === "index" && (
          <div>
          <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px", position: "sticky", top: 0, zIndex: 20, background: "#12151b", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, flexWrap: "wrap" }}>
              <button onClick={() => setMainSection("home")} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 13 }}>← 홈으로</button>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <input type="file" accept=".xlsx,.xls" ref={quoteSetListFileInputRef} onChange={importQuoteSetList} style={{ display: "none" }} />
                <button onClick={() => quoteSetListFileInputRef.current && quoteSetListFileInputRef.current.click()} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬆ 가져오기</button>
                <button onClick={exportQuoteSetList} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬇ 내려받기</button>
                <button onClick={jumpToBookmarkedQuoteSet} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 4 }}>
                  <svg width="11" height="14" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg"><path d="M1 1h14v18l-7-5-7 5V1z" fill="#c9974a" stroke="#c9974a" strokeWidth="1" strokeLinejoin="round" /></svg>
                  책갈피로
                </button>
                <button
                  onClick={undo}
                  disabled={undoCount === 0}
                  className="iconbtn"
                  style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
                >
                  ↺{undoCount > 0 ? ` ${undoCount}` : ""}
                </button>
              </div>
          </div>
          <div style={{ padding: "0 16px 20px" }}>
            <div style={{ fontSize: 27, fontWeight: 800, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
              <span>{QUOTES_ICON}</span>
              <input
                value={sectionLabels.quotes}
                onChange={(e) => setSectionLabel("quotes", e.target.value)}
                style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", fontSize: 27, fontWeight: 800, color: "#e7eaf0", padding: 0 }}
              />
            </div>
            <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 12 }}>제목을 눌러 주요문을 보고, 아래에서 새 명언 모음을 추가하세요. 박스를 왼쪽으로 밀면 삭제/취소를 선택할 수 있어요.</div>

            <input
              value={quoteSetListSearchQuery}
              onChange={(e) => setQuoteSetListSearchQuery(e.target.value)}
              placeholder="🔍 주요문 검색 (제목 또는 내용)"
              className="field"
              style={{ marginBottom: 14, fontSize: 14, padding: "8px 10px" }}
            />

            {quoteSets.length === 0 && (
              <div style={{ textAlign: "center", color: "#8993a6", fontSize: 13, padding: "40px 0" }}>아직 등록된 명언이 없어요.</div>
            )}

            {[...quoteSets]
              .filter((b) => {
                const q = quoteSetListSearchQuery.trim().toLowerCase();
                if (!q) return true;
                return (b.title || "").toLowerCase().includes(q) || b.quotes.some((qq) => qq.text.toLowerCase().includes(q));
              })
              // 번호를 수정하면 그 번호 순서대로 자동 정렬된다.
              .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
              .map((b) => (
              <div key={b.id} ref={(el) => { if (el) quoteSetListRowRefs.current[b.id] = el; }} style={{ display: "flex", gap: 6, alignItems: "flex-start", marginBottom: 10 }}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, flexShrink: 0, paddingTop: 2 }}>
                  <input
                    value={b.number}
                    onChange={(e) => updateQuoteSetNumber(b.id, e.target.value)}
                    inputMode="numeric"
                    className="field"
                    style={{ width: 30, fontSize: 13, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "4px 0" }}
                  />
                  <button type="button" onClick={() => toggleBookmarkedQuoteSet(b.id)} style={{ width: 22, height: 22, border: "none", background: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <svg width="15" height="19" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                      <path d="M1 1h14v18l-7-5-7 5V1z" fill={bookmarkedQuoteSetId === b.id ? "#c9974a" : "#3a4150"} stroke={bookmarkedQuoteSetId === b.id ? "#c9974a" : "#5a6274"} strokeWidth="1" strokeLinejoin="round" />
                    </svg>
                  </button>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <SwipeRow
                    onNavigate={() => { setCurrentQuoteSetId(b.id); setQuoteSetView("book"); }}
                    content={
                      <div style={{ background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                        <div style={{ minWidth: 0 }}>
                          <div style={{ fontSize: 19, fontWeight: 700, color: "#e7eaf0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.title || "(제목 없음)"}</div>
                          <div style={{ fontSize: 12, color: "#8993a6", marginTop: 4 }}>
                            주요문 {b.quotes.length}개 · 읽은날짜 {b.readDate || "미설정"} · 익힘 {b.learnedCount || 0}번
                          </div>
                        </div>
                        <div style={{ color: "#8993a6", fontSize: 18, flexShrink: 0 }}>›</div>
                      </div>
                    }
                    actions={(close) => (
                      <>
                        <button
                          onClick={(e) => { e.stopPropagation(); close(); }}
                          style={{ flex: 1, border: "none", background: "#3a4150", color: "#e7eaf0", fontWeight: 700, fontSize: 13 }}
                        >
                          취소
                        </button>
                        <button
                          onClick={(e) => { e.stopPropagation(); deleteQuoteSet(b.id); }}
                          style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 13 }}
                        >
                          삭제
                        </button>
                      </>
                    )}
                  />
                </div>
              </div>
            ))}

            <div style={{ marginTop: 6 }}>
              <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 8 }}>새 명언 제목을 입력하고 완료(엔터)를 누르면 바로 추가돼요</div>
              <input
                value={newQuoteSetTitle}
                onChange={(e) => setNewQuoteSetTitle(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { e.target.blur(); addQuoteSet(); } }}
                onBlur={addQuoteSet}
                placeholder="새 명언 제목 (예: 인생명언)"
                className="field"
                style={{ width: "100%", fontSize: 14, padding: "10px 12px" }}
              />
            </div>
          </div>
          </div>
        )}

        {quoteSetView === "book" && currentQuoteSet && (
          <BookQuotesView
            book={currentQuoteSet}
            onBack={() => setQuoteSetView("index")}
            onUpdateBook={updateQuoteSet}
            onRenameBook={renameQuoteSet}
            onSnapshotUndo={pushUndoSnapshot}
            undo={undo}
            undoCount={undoCount}
          />
        )}
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: "#e7eaf0", fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif" }}>
      {screenOff && <ScreenOffOverlay onWake={() => setScreenOff(false)} />}
      <style>{`
        .field { background:#12151b; border:1px solid #2a303c; border-radius:8px; color:#e7eaf0; padding:6px 8px; font-size:13px; width:100%; }
        .field:focus { outline:none; border-color:#c9974a; }
        .iconbtn { background:none; border:none; cursor:pointer; }
      `}</style>

      {mainView === "index" && (
        <div>
          <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px", position: "sticky", top: 0, zIndex: 20, background: "#12151b", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, flexWrap: "wrap" }}>
            <button onClick={() => setMainSection("home")} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 13 }}>← 홈으로</button>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <input type="file" accept=".xlsx,.xls" ref={bookListFileInputRef} onChange={importBookList} style={{ display: "none" }} />
              <button onClick={() => bookListFileInputRef.current && bookListFileInputRef.current.click()} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬆ 가져오기</button>
              <button onClick={exportBookList} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬇ 내려받기</button>
              <button onClick={jumpToBookmarkedBook} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 4 }}>
                <svg width="11" height="14" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg"><path d="M1 1h14v18l-7-5-7 5V1z" fill="#c9974a" stroke="#c9974a" strokeWidth="1" strokeLinejoin="round" /></svg>
                책갈피로
              </button>
              <button
                onClick={undo}
                disabled={undoCount === 0}
                className="iconbtn"
                style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
              >
                ↺{undoCount > 0 ? ` ${undoCount}` : ""}
              </button>
            </div>
          </div>
          <div style={{ padding: "0 16px 20px" }}>
          <div style={{ fontSize: 41, fontWeight: 800, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
            <span>📖</span>
            <input
              value={sectionLabels.reading}
              onChange={(e) => setSectionLabel("reading", e.target.value)}
              style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", fontSize: 41, fontWeight: 800, color: "#e7eaf0", padding: 0 }}
            />
          </div>
          <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 12 }}>책을 눌러 주요문/요약을 보고, 아래에서 새 책을 추가하세요. 박스를 왼쪽으로 밀면 삭제/취소를 선택할 수 있어요.</div>

          <input
            value={bookListSearchQuery}
            onChange={(e) => setBookListSearchQuery(e.target.value)}
            placeholder="🔍 주요문 검색 (책 제목 또는 내용)"
            className="field"
            style={{ marginBottom: 14, fontSize: 14, padding: "8px 10px" }}
          />

          {books.length === 0 && (
            <div style={{ textAlign: "center", color: "#8993a6", fontSize: 13, padding: "40px 0" }}>아직 등록된 책이 없어요.</div>
          )}

          {[...books]
            .filter((b) => {
              const q = bookListSearchQuery.trim().toLowerCase();
              if (!q) return true;
              return (b.title || "").toLowerCase().includes(q) || b.quotes.some((qq) => qq.text.toLowerCase().includes(q));
            })
            .sort((a, b) => {
              const da = a.readDate || "";
              const db = b.readDate || "";
              if (!da && !db) return 0;
              if (!da) return 1;
              if (!db) return -1;
              return db.localeCompare(da); // 최근에 읽은 책이 먼저
            })
            .map((b, idx) => (
            <div key={b.id} ref={(el) => { if (el) bookListRowRefs.current[b.id] = el; }} style={{ display: "flex", gap: 6, alignItems: "flex-start", marginBottom: 10 }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, flexShrink: 0, paddingTop: 2 }}>
                <div className="field" style={{ width: 30, fontSize: 13, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "4px 0" }}>{idx + 1}</div>
                <button type="button" onClick={() => toggleBookmarkedBook(b.id)} style={{ width: 22, height: 22, border: "none", background: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <svg width="15" height="19" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1h14v18l-7-5-7 5V1z" fill={bookmarkedBookId === b.id ? "#c9974a" : "#3a4150"} stroke={bookmarkedBookId === b.id ? "#c9974a" : "#5a6274"} strokeWidth="1" strokeLinejoin="round" />
                  </svg>
                </button>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <SwipeRow
                  onNavigate={() => { setCurrentBookId(b.id); setMainView("book"); }}
                  content={
                    <div style={{ background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 19, fontWeight: 700, color: "#e7eaf0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.title || "(제목 없음)"}</div>
                        <div style={{ fontSize: 12, color: "#8993a6", marginTop: 4 }}>
                          주요문 {b.quotes.length}개 · 읽은날짜 {b.readDate || "미설정"} · 익힘 {b.learnedCount || 0}번
                        </div>
                      </div>
                      <div style={{ color: "#8993a6", fontSize: 18, flexShrink: 0 }}>›</div>
                    </div>
                  }
                  actions={(close) => (
                    <>
                      <button
                        onClick={(e) => { e.stopPropagation(); close(); }}
                        style={{ flex: 1, border: "none", background: "#3a4150", color: "#e7eaf0", fontWeight: 700, fontSize: 13 }}
                      >
                        취소
                      </button>
                      <button
                        onClick={(e) => { e.stopPropagation(); deleteBook(b.id); }}
                        style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 13 }}
                      >
                        삭제
                      </button>
                    </>
                  )}
                />
              </div>
            </div>
          ))}

          <div style={{ marginTop: 6 }}>
            <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 8 }}>새 책 제목을 입력하고 추가하세요</div>
            <div style={{ display: "flex", gap: 8 }}>
              <input
                value={newBookTitle}
                onChange={(e) => setNewBookTitle(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") addBook(); }}
                placeholder="새 책 제목 (예: 투자명언)"
                className="field"
                style={{ flex: 1, fontSize: 14, padding: "10px 12px" }}
              />
              <button
                onClick={addBook}
                className="iconbtn"
                style={{ border: "1px solid #c9974a", background: "rgba(201,151,74,0.12)", color: "#c9974a", fontWeight: 700, fontSize: 13, borderRadius: 10, padding: "0 16px", whiteSpace: "nowrap" }}
              >
                + 추가
              </button>
            </div>
          </div>
          </div>
        </div>
      )}

      {mainView === "book" && currentBook && (
        <BookQuotesView
          book={currentBook}
          onBack={() => setMainView("index")}
          onUpdateBook={updateBook}
          onRenameBook={renameBook}
          onSnapshotUndo={pushUndoSnapshot}
          undo={undo}
          undoCount={undoCount}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function () {
  try {
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: ['react'], filename: 'app.jsx' }).code;
    out += '\n//# sourceURL=app-source.js';
    (0, eval)(out);
  } catch (compileErr) {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#2a0f0f;color:#ffb4ae;font:12px/1.5 -apple-system,sans-serif;padding:14px;white-space:pre-wrap;';
    box.textContent = '오류: ' + (compileErr && compileErr.message ? compileErr.message : String(compileErr));
    document.body.appendChild(box);
  }
})();
</script>
</body>
</html>

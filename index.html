const { useState, useEffect, useRef } = React;

const num = (v) => {
  const normalized = typeof v === "string" ? v.replace(/[\u2010-\u2015\u2212]/g, "-") : v;
  const n = parseFloat(normalized);
  return isNaN(n) ? 0 : n;
};

let __idCounter = 0;
const genId = () => `id-${Date.now()}-${__idCounter++}-${Math.random().toString(36).slice(2, 8)}`;

const pad2 = (n) => String(n).padStart(2, "0");
const yymmdd = () => {
  const d = new Date();
  return `${String(d.getFullYear()).slice(2)}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
};
const sanitizeFileName = (s) => (s && s.trim() ? s.trim() : "제목없음").replace(/[\\/:*?"<>|]/g, "_");
const buildFileName = (title) => `${sanitizeFileName(title)}(${yymmdd()}).xlsx`;

// 문자열 유사도(0~1). 두 글자씩 묶은 바이그램을 서로 비교하는 Dice 계수 방식.
const toBigrams = (s) => {
  const norm = s.replace(/\s+/g, " ").trim().toLowerCase();
  const grams = [];
  for (let i = 0; i < norm.length - 1; i++) grams.push(norm.substring(i, i + 2));
  return grams;
};
const textSimilarity = (a, b) => {
  const ga = toBigrams(a);
  const gb = toBigrams(b);
  if (ga.length === 0 || gb.length === 0) {
    return a.replace(/\s+/g, " ").trim().toLowerCase() === b.replace(/\s+/g, " ").trim().toLowerCase() ? 1 : 0;
  }
  const counts = new Map();
  ga.forEach((g) => counts.set(g, (counts.get(g) || 0) + 1));
  let overlap = 0;
  gb.forEach((g) => {
    const c = counts.get(g) || 0;
    if (c > 0) { overlap++; counts.set(g, c - 1); }
  });
  return (2 * overlap) / (ga.length + gb.length);
};
const isDuplicateText = (text, others, threshold = 0.8) => others.some((t) => textSimilarity(text, t) >= threshold);

// "3 학이시습지...", "7.  그가..." 처럼 본문 맨 앞에 붙은 "숫자(+마침표/괄호 등) + 공백"은
// 순서를 잡는 데만 참고하고, 실제 저장되는 내용에서는 떼어낸다.
const splitLeadingNumber = (raw) => {
  const m = raw.match(/^\s*(\d{1,4})\s*[.)\-:]?\s+(\S[\s\S]*)$/);
  if (!m) return { leadingNumber: null, text: raw.trim() };
  return { leadingNumber: num(m[1]), text: m[2].trim() };
};

// "1-1", "1.2" 처럼 상위번호-하위번호로 된 줄을 인식한다. 상위 숫자 뒤에 하위 숫자가 붙어있으면
// 그 상위번호의 하위 항목으로 보고, 정렬 시 상위번호 바로 다음에 오도록 소수 형태의 정렬값을 만든다.
const parseHierNumber = (raw) => {
  const m = raw.match(/^\s*(\d{1,4})\s*[.\-](\d{1,4})\s*[.)\-:]?\s+(\S[\s\S]*)$/);
  if (!m) return null;
  const major = num(m[1]);
  const minor = num(m[2]);
  return { major, minor, sortValue: major + minor / 1000, label: `${m[1]}-${m[2]}`, text: m[3].trim() };
};

// 아이폰 메모 앱과 주고받기 위한 순수 텍스트 변환 (메모 앱은 별도 API가 없어서,
// 공유시트/복사-붙여넣기를 매개로 삼는다). 메모 앱의 번호 목록/하위 목록 형식에 맞춰,
// 번호는 줄 맨 앞에 "1. "로, 하위 항목은 탭(Tab)으로 들여써서 내보낸다 — 메모 앱은 탭으로
// 들여쓴 번호줄을 하위 목록으로 자동 인식한다. 항목 사이에 빈 줄도 넣지 않아 한 목록으로 이어지게 한다.
const buildQuotesPlainText = (title, quotes) => {
  const sorted = [...quotes].sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));
  let topCounter = 0;
  const lines = sorted.map((q) => {
    const hier = parseHierNumber(q.text);
    if (hier) return `\t${hier.label}. ${hier.text}`;
    if (/^[-–—]\s*\S/.test(q.text)) return `\t${q.text}`;
    topCounter += 1;
    return `${topCounter}. ${q.text}`;
  });
  return `${title || "제목 없음"}\n\n${lines.join("\n")}`;
};
const parseQuotesFromPlainText = (text) => {
  const rawLines = text.split(/\r?\n/).map((line) => line.trim()).filter((line) => line);
  let currentParent = null; // 가장 최근에 나온 상위 숫자
  let subCounter = 0; // 그 상위 숫자 아래 하위 항목이 몇 번째인지
  const items = rawLines.map((line, idx) => {
    const hier = parseHierNumber(line);
    if (hier) {
      currentParent = hier.major;
      subCounter += 1;
      return { text: `${hier.label}. ${hier.text}`, sortValue: hier.major + subCounter * 0.0001, order: idx };
    }
    const { leadingNumber, text: stripped } = splitLeadingNumber(line);
    if (leadingNumber != null) {
      currentParent = leadingNumber;
      subCounter = 0;
      return { text: stripped, sortValue: leadingNumber, order: idx };
    }
    // 숫자가 아예 없는 줄(맨 앞 대시("-") 표시가 있는 줄 포함): 바로 앞에 나온 상위 숫자가
    // 있으면 그 숫자의 하위 항목으로, 다음 숫자가 나오기 전까지 붙여넣은 순서 그대로 이어붙인다.
    // 대시는 그대로 두고 내용에서 떼어내지 않는다 (내보낼 때도 같은 모양으로 남겨야 하므로).
    if (currentParent != null) {
      subCounter += 1;
      return { text: line, sortValue: currentParent + subCounter * 0.0001, order: idx, isPlainSub: true };
    }
    return { text: line, sortValue: null, order: idx };
  });
  return items
    .filter((it) => it.text)
    // 번호가 붙어있던 줄은 그 번호 순서대로(하위번호·숫자 없는 하위문장은 상위번호 바로 다음에),
    // 번호가 하나도 없는 줄은 원래 붙여넣은 순서를 그대로 따른다.
    .sort((a, b) => {
      if (a.sortValue != null && b.sortValue != null) return a.sortValue - b.sortValue;
      if (a.sortValue != null) return -1;
      if (b.sortValue != null) return 1;
      return a.order - b.order;
    })
    .map((it) => it.text);
};

// "번호나눔": 번호가 붙은 줄부터 다음 번호가 나오기 전까지의 모든 줄(하위문장, 대시줄 등)을
// 하나의 주요문으로 묶는다. 줄나눔(한 줄 = 한 개)과 달리 한 번호 블록 전체 = 한 개가 된다.
const parseQuotesByNumberBlocks = (text) => {
  const rawLines = text.split(/\r?\n/).map((line) => line.trim()).filter((line) => line);
  const blocks = [];
  let current = null;
  rawLines.forEach((line, idx) => {
    const hier = parseHierNumber(line);
    if (hier) {
      current = { text: `${hier.label}. ${hier.text}`, sortValue: hier.major + 0.0001, order: idx };
      blocks.push(current);
      return;
    }
    const { leadingNumber, text: stripped } = splitLeadingNumber(line);
    if (leadingNumber != null) {
      current = { text: stripped, sortValue: leadingNumber, order: idx };
      blocks.push(current);
      return;
    }
    // 번호 없는 줄: 다음 번호가 나오기 전까지 바로 앞 블록에 이어붙인다.
    if (current) {
      current.text = `${current.text}\n${line}`;
    } else {
      blocks.push({ text: line, sortValue: null, order: idx });
    }
  });
  return blocks
    .filter((b) => b.text)
    .sort((a, b) => {
      if (a.sortValue != null && b.sortValue != null) return a.sortValue - b.sortValue;
      if (a.sortValue != null) return -1;
      if (b.sortValue != null) return 1;
      return a.order - b.order;
    })
    .map((b) => b.text);
};

const buildQuotesWorkbook = (title, quotes) => {
  const rows = [...quotes]
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
    .map((q) => ({ "번호": q.number, "주요문": q.text }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ "안내": "저장된 주요문 없음" }]), sanitizeFileName(title).slice(0, 31) || "주요문");
  return wb;
};

// 목록 전체(책 여러 권/명언 여러 개/설교 여러 개)를 한 파일로 내보낼 때, 항목마다 시트를 하나씩 만든다.
const buildMultiItemWorkbook = (items) => {
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  items.forEach((item, idx) => {
    let name = sanitizeFileName(item.title || `항목${idx + 1}`).slice(0, 28) || `항목${idx + 1}`;
    let finalName = name;
    let n = 2;
    while (usedNames.has(finalName)) { finalName = `${name}${n}`.slice(0, 31); n++; }
    usedNames.add(finalName);
    const rows = [...item.quotes]
      .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
      .map((q) => ({ "번호": q.number, "주요문": q.text }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ "안내": "저장된 주요문 없음" }]), finalName);
  });
  return wb;
};

// 위 다중 시트 파일을 다시 읽어서, 시트 하나당 항목 하나씩(제목=시트 이름) 만들어 돌려준다.
const parseMultiItemWorkbook = (arrayBuffer, makeItem) => {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  return wb.SheetNames.map((sheetName) => {
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    const quotes = rows
      .map((row) => {
        const rawText = String(row["주요문"] ?? row["명언"] ?? row["내용"] ?? Object.values(row)[1] ?? "").trim();
        const { leadingNumber, text } = splitLeadingNumber(rawText);
        const numberRaw = row["번호"] ?? Object.values(row)[0];
        const number = num(numberRaw) || leadingNumber || 0;
        return { id: genId(), number, text };
      })
      .filter((q) => q.text)
      .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
      .map((q, idx) => ({ ...q, number: idx + 1 }));
    return makeItem(sheetName, quotes);
  }).filter((item) => item.quotes.length > 0);
};

const BOOKS_KEY = "reading-summary-books-v2";

const seedBooks = [
  {
    id: genId(),
    title: "투자명언",
    learnedCount: 0,
    bookmarkQuoteId: null,
    readDate: new Date().toISOString().slice(0, 10),
    quotes: [
      { id: genId(), number: 1, text: "ROE와 영업이익율이 높아 해자가 있는 기업을 가지고 있어야 한다." },
      { id: genId(), number: 2, text: "학이시습지 불역열호(學而時習之 不亦說乎) : 배우고 때때로 익히면 또한 기쁘지 아니한가" },
      { id: genId(), number: 3, text: "물극필반(物極必反) : 사물이 극에 달하면 반드시 반전이 일어난다" },
      { id: genId(), number: 4, text: "니체의 삶의 태도\n메멘토 모리 (Memento Mori) : 죽음을 기억하라 (삶의 한계를 인지함)\n아모르 파티 (Amor Fati) : 운명을 사랑하라 (필연적인 삶의 과정을 수용함)\n카르페 디엠 (Carpe Diem) : 현재를 잡아라 / 오늘을 즐겨라 (지금을 적극적으로 살아감)" },
      { id: genId(), number: 5, text: "반드시 주식은 고점일 때 팔고 저점일 때 사야 한다." },
    ],
  },
];

function loadBooks() {
  try {
    const saved = JSON.parse(localStorage.getItem(BOOKS_KEY));
    return Array.isArray(saved) && saved.length > 0 ? saved : seedBooks;
  } catch (e) { return seedBooks; }
}

// ---- 명언 (독서완료와 같은 형식의 별도 모음) ----
const QUOTESETS_KEY = "reading-summary-quotesets-v1";
function loadQuoteSets() {
  try {
    const saved = JSON.parse(localStorage.getItem(QUOTESETS_KEY));
    return Array.isArray(saved) ? saved : [];
  } catch (e) { return []; }
}
const QUOTES_ICON = "📜";

// ---- 교회설교요약 ----
const SERMONS_KEY = "reading-summary-sermons-v1";
const DEFAULT_PREACHER = "이규현 목사";

const toDateStr = (d) => {
  const y = d.getFullYear();
  const m = pad2(d.getMonth() + 1);
  const day = pad2(d.getDate());
  return `${y}-${m}-${day}`;
};
// "YYYY-MM-DD" 문자열을 로컬 자정 기준 Date로 만든다. new Date("YYYY-MM-DD")는 UTC 자정으로
// 해석되기 때문에, 한국(UTC+9) 등에서는 mostRecentSunday(로컬 자정 기준)와 비교할 때 최대 하루 어긋나서
// "오늘이 일요일인데도 생성 안 됨" 같은 버그가 생긴다. 항상 이 함수로 파싱해서 기준을 통일한다.
const parseLocalDate = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const mostRecentSunday = (base) => {
  const d = new Date(base);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay()); // getDay(): 0=일요일
  return d;
};
const makeSermon = (dateStr, preacher) => ({
  id: genId(),
  date: dateStr,
  title: "",
  scripture: "",
  preacher: preacher || DEFAULT_PREACHER,
  learnedCount: 0,
  bookmarkQuoteId: null,
  quotes: [],
});

// 마지막으로 만들어둔 설교 날짜 다음 주부터, 오늘이 속한 주의 일요일까지 빠진 일요일을 채워 넣는다.
// (웹앱은 앱이 닫혀있는 동안 정확히 "일요일 오전 5시"에 실행될 수는 없어서, 다음에 앱을 열 때 놓친 주를 한번에 보충한다.)
// deletedDates에 들어있는 날짜는 사용자가 수동으로 지운 것이므로 다시 자동 생성하지 않는다.
const ensureSundays = (list, deletedDates) => {
  const deleted = deletedDates || new Set();
  const latestSunday = mostRecentSunday(new Date());
  const next = [...list];
  const existingDates = new Set(next.map((s) => s.date));
  if (next.length === 0) {
    const seedDate = toDateStr(latestSunday);
    if (!deleted.has(seedDate)) next.push(makeSermon(seedDate));
    return next;
  }
  const lastPreacher = next.reduce((latest, s) => (s.date > latest.date ? s : latest), next[0]).preacher;
  let maxDateStr = next.reduce((m, s) => (s.date > m ? s.date : m), next[0].date);
  let cursor = parseLocalDate(maxDateStr);
  cursor.setDate(cursor.getDate() + 7);
  while (cursor <= latestSunday) {
    const ds = toDateStr(cursor);
    if (!existingDates.has(ds) && !deleted.has(ds)) {
      next.push(makeSermon(ds, lastPreacher));
      existingDates.add(ds);
    }
    cursor.setDate(cursor.getDate() + 7);
  }
  return next;
};

// 본문을 눌러 왼쪽으로 당기면 삭제/취소 버튼이 나타나는 스와이프 행.
// onNavigate가 없으면 탭해도 이동하지 않고(내부 입력칸이 정상적으로 반응), 스와이프로 열고 닫는 것만 동작한다.
function SwipeRow({ onNavigate, content, actions, actionWidth = 132, gap = 10, borderRadius = 12 }) {
  const [dragX, setDragX] = useState(0);
  const [open, setOpen] = useState(false);
  const info = useRef({ x: 0, y: 0, base: 0, active: null, dragged: false, lastX: 0 });

  const onTouchStart = (e) => {
    const t = e.touches[0];
    const tag = e.target && e.target.tagName;
    const isEditable = tag === "INPUT" || tag === "TEXTAREA";
    // 이미 포커스가 들어가 있어 "수정/선택 중"인 입력칸에서 시작된 드래그만 스와이프-삭제로
    // 인식하지 않는다(글자 선택/커서 이동 보호). 아직 선택(포커스)되지 않은 칸이면 평소처럼
    // 왼쪽으로 밀어서 삭제/취소를 열 수 있게 스와이프 판정을 그대로 살려둔다.
    const isBeingEdited = isEditable && document.activeElement === e.target;
    const startBase = open ? -actionWidth : 0;
    info.current = { x: t.clientX, y: t.clientY, base: startBase, active: isBeingEdited ? false : null, dragged: false, lastX: startBase };
  };
  const onTouchMove = (e) => {
    if (info.current.active === false) return;
    const t = e.touches[0];
    const dx = t.clientX - info.current.x;
    const dy = t.clientY - info.current.y;
    if (info.current.active === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      info.current.active = Math.abs(dx) > Math.abs(dy);
    }
    if (info.current.active) {
      info.current.dragged = true;
      let next = info.current.base + dx;
      next = Math.max(-actionWidth, Math.min(0, next));
      info.current.lastX = next;
      setDragX(next);
    }
  };
  const onTouchEnd = () => {
    if (info.current.active) {
      // React state(dragX)는 마지막 touchmove 이후 리렌더가 아직 안 끝났을 수 있어 값이 늦게
      // 반영될 수 있으므로, ref에 즉시 기록해둔 lastX를 기준으로 판정한다.
      const shouldOpen = info.current.lastX < -actionWidth / 2;
      setOpen(shouldOpen);
      setDragX(shouldOpen ? -actionWidth : 0);
    }
  };
  const close = () => { setOpen(false); setDragX(0); };
  const handleContentClick = () => {
    if (info.current.dragged) { info.current.dragged = false; return; }
    if (open) { close(); return; }
    if (onNavigate) onNavigate();
  };

  return (
    <div style={{ position: "relative", overflow: "hidden", borderRadius, marginBottom: gap }}>
      <div style={{ position: "absolute", top: 0, right: 0, bottom: 0, width: actionWidth, display: "flex" }}>
        {actions(close)}
      </div>
      <div
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onClick={handleContentClick}
        style={{ transform: `translateX(${dragX}px)`, transition: info.current.active ? "none" : "transform 0.2s ease", touchAction: "pan-y", position: "relative", zIndex: 1, cursor: onNavigate ? "pointer" : "default", background: "#12151b" }}
      >
        {content}
      </div>
    </div>
  );
}

function BookQuotesView({ book, onBack, onUpdateBook, onRenameBook, onSnapshotUndo, undo, undoCount }) {
  const [newQuoteNumber, setNewQuoteNumber] = useState("");
  const [newQuoteText, setNewQuoteText] = useState("");
  const [splitByNumber, setSplitByNumber] = useState(false);
  const [quoteSearchQuery, setQuoteSearchQuery] = useState("");
  const quoteRowRefs = useRef({});
  const fileInputRef = useRef(null);

  const persistQuotes = (next) => onUpdateBook({ ...book, quotes: next });

  const renumberQuotes = (list) => [...list]
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
    .map((q, idx) => ({ ...q, number: idx + 1 }));

  const addQuote = () => {
    const raw = newQuoteText;
    const text = raw.trim();
    if (!text) return;
    // 번호나눔이 켜져 있으면 번호 블록 단위로(다음 번호 전까지 한 개), 줄나눔이 켜져 있으면
    // 한 줄씩, 붙여넣기와 똑같은 방식으로 나눠서 주요문을 만든다.
    const splitParser = splitByNumber ? parseQuotesByNumberBlocks : null;
    if (splitParser && raw.includes("\n")) {
      const parsed = splitParser(raw);
      if (parsed.length > 1) {
        const acceptedTexts = book.quotes.map((q) => q.text);
        const uniqueImported = [];
        for (const t of parsed) {
          if (isDuplicateText(t, acceptedTexts)) continue;
          acceptedTexts.push(t);
          uniqueImported.push({ id: genId(), number: 0, text: t });
        }
        const skipped = parsed.length - uniqueImported.length;
        if (uniqueImported.length > 0) {
          persistQuotes([...book.quotes, ...uniqueImported].map((q, idx) => ({ ...q, number: idx + 1 })));
        }
        setNewQuoteNumber("");
        setNewQuoteText("");
        if (skipped > 0) alert(`${uniqueImported.length}개를 추가했어요. (80% 이상 비슷한 내용 ${skipped}개 제외)`);
        return;
      }
    }
    if (isDuplicateText(text, book.quotes.map((q) => q.text))) {
      setNewQuoteNumber("");
      setNewQuoteText("");
      alert("기존 주요문과 80% 이상 비슷한 내용이라 기존 내용을 그대로 두고 추가하지 않았어요.");
      return;
    }
    const maxNum = book.quotes.reduce((m, q) => Math.max(m, num(q.number) || 0), 0);
    const number = newQuoteNumber.trim() ? num(newQuoteNumber) : maxNum + 1;
    persistQuotes([...book.quotes, { id: genId(), number, text }]);
    setNewQuoteNumber("");
    setNewQuoteText("");
  };

  // 삭제할 때 화면이 튀지 않도록, 삭제 직후 스크롤 위치를 원래 자리로 고정한다.
  const deleteQuoteById = (id) => {
    const scrollY = window.scrollY;
    persistQuotes(book.quotes.filter((q) => q.id !== id));
    const restore = () => window.scrollTo(0, scrollY);
    requestAnimationFrame(() => { restore(); requestAnimationFrame(restore); });
  };

  const updateQuoteNumber = (id, value) => {
    // "1+2+3"처럼 +로 여러 번호를 적으면, 그 번호들의 내용을 순서대로 합쳐서 맨 앞 번호(예: 1) 하나로 만든다.
    if (value.includes("+")) {
      const parts = value.split("+").map((s) => s.trim()).filter(Boolean);
      if (parts.length > 1) {
        const targets = parts.map((p) => book.quotes.find((q) => String(q.number) === p)).filter(Boolean);
        if (targets.length > 1) {
          onSnapshotUndo();
          const mergedText = targets.map((q) => q.text).join("\n");
          const keepId = targets[0].id;
          const mergedNumber = targets[0].number;
          const removeIds = new Set(targets.slice(1).map((q) => q.id));
          const next = book.quotes
            .filter((q) => !removeIds.has(q.id))
            .map((q) => (q.id === keepId ? { ...q, text: mergedText, number: mergedNumber } : q));
          persistQuotes(next);
          return;
        }
      }
    }
    // 번호를 바꿔도 목록에서의 위치(줄)는 그대로 두고, 그 항목의 번호 표시만 바꾼다.
    persistQuotes(book.quotes.map((q) => (q.id === id ? { ...q, number: value.trim() === "" ? value : num(value) } : q)));
  };

  const updateQuoteText = (id, value) => {
    if (value.trim() === "") {
      onSnapshotUndo();
      // 지워서 삭제할 때도 남은 항목들의 번호는 그대로 두고(다시 매기지 않고) 그 줄만 뺀다.
      deleteQuoteById(id);
      return;
    }
    persistQuotes(book.quotes.map((q) => (q.id === id ? { ...q, text: value } : q)));
  };

  const toggleBookmark = (id) => {
    onUpdateBook({ ...book, bookmarkQuoteId: book.bookmarkQuoteId === id ? null : id });
  };

  const jumpToBookmark = () => {
    const node = book.bookmarkQuoteId && quoteRowRefs.current[book.bookmarkQuoteId];
    if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const setLearnedCount = (v) => {
    const n = Number(v);
    onUpdateBook({ ...book, learnedCount: Number.isFinite(n) && n >= 0 ? n : 0 });
  };

  const exportToExcel = () => {
    XLSX.writeFile(buildQuotesWorkbook(book.title, book.quotes), buildFileName(book.title));
  };

  // 아이폰 "메모" 앱에는 직접 저장하는 API가 없어서, 공유시트를 띄워 사용자가 '메모'를 선택하도록 한다.
  const shareToNotes = async () => {
    const text = buildQuotesPlainText(book.title, book.quotes);
    if (navigator.share) {
      try { await navigator.share({ title: book.title || "주요문", text }); } catch (e) {}
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      alert("이 기기에서는 공유시트를 지원하지 않아 대신 클립보드에 복사했어요. 메모 앱을 열어 붙여넣어주세요.");
    } catch (e) {
      alert("공유하거나 복사하지 못했어요.");
    }
  };

  const importFromNotesText = (rawText) => {
    const lines = rawText.split(/\r?\n/);
    let title = null;
    let bodyText = rawText;
    // 우리 내보내기 형식(제목 줄 다음 빈 줄)과 같은 모양이면 첫 줄을 제목으로 분리한다.
    if (lines.length > 1 && lines[0].trim() && lines[1] !== undefined && lines[1].trim() === "") {
      title = lines[0].trim();
      bodyText = lines.slice(2).join("\n");
    }
    const splitParser = parseQuotesByNumberBlocks;
    const parsed = splitParser(bodyText);
    if (parsed.length === 0) return false;
    const acceptedTexts = book.quotes.map((q) => q.text);
    const uniqueImported = [];
    for (const text of parsed) {
      if (isDuplicateText(text, acceptedTexts)) continue;
      acceptedTexts.push(text);
      uniqueImported.push({ id: genId(), number: 0, text });
    }
    const skipped = parsed.length - uniqueImported.length;
    const finalQuotes = uniqueImported.length > 0
      ? [...book.quotes, ...uniqueImported].map((q, idx) => ({ ...q, number: idx + 1 }))
      : book.quotes;
    // 제목 변경과 주요문 추가를 한 번의 업데이트로 같이 반영한다(따로 호출하면 나중 호출이
    // 앞 호출로 바뀐 내용을 오래된 상태로 덮어써버리는 문제가 있었다).
    onUpdateBook({ ...book, quotes: finalQuotes, ...(title ? { title } : {}) });
    if (title) setTitleDraft(title);
    alert(`${uniqueImported.length}개를 가져왔어요.${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}${title ? ` 제목도 "${title}"(으)로 반영했어요.` : ""}`);
    return true;
  };

  const handleNewQuotePaste = (e) => {
    if (!splitByNumber) return; // 번호나눔이 꺼져있으면 기본 붙여넣기 그대로(한 칸에 전부 들어감)
    const pasted = e.clipboardData ? e.clipboardData.getData("text") : "";
    if (!pasted || !pasted.includes("\n")) return; // 한 줄짜리는 기본 붙여넣기 그대로 둔다
    e.preventDefault();
    const handled = importFromNotesText(pasted);
    if (!handled) setNewQuoteText((prev) => prev + pasted);
  };

  // 제목 칸은 한 줄짜리 입력창이라, 여러 줄을 그대로 붙여넣으면 브라우저가 첫 줄만 남기고
  // 나머지를 버려버린다. 그래서 제목 칸에 붙여넣을 때도 첫 줄은 제목으로, 나머지는 주요문으로
  // 직접 나눠서 넣어준다 (이때는 첫 줄 뒤에 빈 줄이 없어도 항상 첫 줄을 제목으로 본다).
  const handleTitlePaste = (e) => {
    const pasted = e.clipboardData ? e.clipboardData.getData("text") : "";
    if (!pasted || !pasted.includes("\n")) return;
    e.preventDefault();
    const lines = pasted.split(/\r?\n/);
    const firstIdx = lines.findIndex((l) => l.trim());
    if (firstIdx === -1) return;
    const title = lines[firstIdx].trim();
    let bodyLines = lines.slice(firstIdx + 1);
    if (bodyLines[0] !== undefined && bodyLines[0].trim() === "") bodyLines = bodyLines.slice(1);
    const splitParser = parseQuotesByNumberBlocks;
    const parsed = splitParser(bodyLines.join("\n"));
    const acceptedTexts = book.quotes.map((q) => q.text);
    const uniqueImported = [];
    for (const text of parsed) {
      if (isDuplicateText(text, acceptedTexts)) continue;
      acceptedTexts.push(text);
      uniqueImported.push({ id: genId(), number: 0, text });
    }
    const skipped = parsed.length - uniqueImported.length;
    const finalQuotes = uniqueImported.length > 0
      ? [...book.quotes, ...uniqueImported].map((q, idx) => ({ ...q, number: idx + 1 }))
      : book.quotes;
    onUpdateBook({ ...book, quotes: finalQuotes, title });
    setTitleDraft(title);
    alert(`제목을 "${title}"(으)로 반영했어요.${uniqueImported.length > 0 ? ` 주요문 ${uniqueImported.length}개도 가져왔어요.` : ""}${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}`);
  };

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        const imported = rows
          .map((row) => {
            const rawText = String(row["주요문"] ?? row["명언"] ?? row["내용"] ?? Object.values(row)[1] ?? "").trim();
            const { leadingNumber, text } = splitLeadingNumber(rawText);
            // 번호 열 값이 있으면 그걸 우선 쓰고, 없으면 본문 앞에 붙어 있던 숫자를 순서 참고용으로 쓴다.
            // 어느 쪽이든 최종 저장 시 전체를 1,2,3...으로 다시 매기므로 이 값 자체가 내용에 남지는 않는다.
            const numberRaw = row["번호"] ?? Object.values(row)[0];
            const number = num(numberRaw) || leadingNumber || 0;
            return { id: genId(), number, text };
          })
          .filter((q) => q.text);
        if (imported.length === 0) {
          alert("엑셀에서 읽을 수 있는 내용이 없어요. '번호'/'주요문' 열이 있는지 확인해주세요.");
          return;
        }
        // 기존 내용과 80% 이상 비슷하면 같은 내용으로 보고 제외한다. 가져오는 목록 안에서도 서로 비교해 중복은 하나만 남긴다.
        const acceptedTexts = book.quotes.map((q) => q.text);
        const uniqueImported = [];
        for (const q of imported) {
          if (isDuplicateText(q.text, acceptedTexts)) continue;
          acceptedTexts.push(q.text);
          uniqueImported.push(q);
        }
        const skipped = imported.length - uniqueImported.length;
        if (uniqueImported.length === 0) {
          alert("가져올 새 내용이 없어요 (전부 이미 있는 내용과 80% 이상 비슷해요).");
          return;
        }
        const merged = [...book.quotes, ...uniqueImported].sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));
        persistQuotes(merged.map((q, idx) => ({ ...q, number: idx + 1 })));
        alert(`${uniqueImported.length}개를 가져왔어요.${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}`);
      } catch (err) {
        alert("엑셀 파일을 읽지 못했어요: " + (err.message || err));
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const [titleDraft, setTitleDraft] = useState(book.title || "");
  useEffect(() => { setTitleDraft(book.title || ""); }, [book.id]);

  const filteredQuotes = book.quotes
    .filter((q) => {
      const query = quoteSearchQuery.trim().toLowerCase();
      if (!query) return true;
      return q.text.toLowerCase().includes(query) || String(q.number).includes(query);
    });
    // 번호로 다시 정렬하지 않는다 — 목록 순서는 저장된 순서(줄) 그대로 유지한다.

  return (
    <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 10px) 0 0" }}>
      <div style={{ padding: "0 10px 10px", position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20, background: "#12151b", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, flexWrap: "wrap" }}>
        <button onClick={onBack} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 14 }}>← 뒤로</button>
        <div style={{ display: "flex", gap: 6 }}>
          <input type="file" accept=".xlsx,.xls" ref={fileInputRef} onChange={handleImportFile} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬆ 가져오기</button>
          <button onClick={exportToExcel} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬇ 내려받기</button>
          <button onClick={jumpToBookmark} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 4 }}>
            <svg width="11" height="14" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg" style={{ flexShrink: 0 }}>
              <path d="M1 1h14v18l-7-5-7 5V1z" fill="#c9974a" stroke="#c9974a" strokeWidth="1" strokeLinejoin="round" />
            </svg>
            책갈피로
          </button>
          <button onClick={shareToNotes} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>📤 메모내보내기</button>
          <button
            onClick={undo}
            disabled={undoCount === 0}
            className="iconbtn"
            style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
          >
            ↺{undoCount > 0 ? ` ${undoCount}` : ""}
          </button>
        </div>
      </div>
      <div style={{ padding: "0 8px 40px" }}>
        <div style={{ marginBottom: 16 }}>
          <input
            value={titleDraft}
            onChange={(e) => setTitleDraft(e.target.value)}
            onBlur={() => onRenameBook(titleDraft.trim() || "(제목 없음)")}
            onPaste={handleTitlePaste}
            placeholder="책 제목"
            style={{ width: "100%", background: "transparent", border: "none", outline: "none", fontSize: 27, fontWeight: 800, color: "#e7eaf0", lineHeight: 1.4, padding: 0, marginBottom: 10 }}
          />
          <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 14, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
              <span style={{ fontSize: 14.5, color: "#8993a6" }}>읽은날짜</span>
              <input
                type="date"
                value={book.readDate || ""}
                onChange={(e) => onUpdateBook({ ...book, readDate: e.target.value })}
                className="field"
                style={{ width: 132, fontSize: 15.5, fontWeight: 700, color: "#c9974a", padding: "5px 4px" }}
              />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
              <span style={{ fontSize: 12, color: "#8993a6" }}>익힘</span>
              <button
                type="button"
                onClick={() => setLearnedCount((num(book.learnedCount) || 0) + 1)}
                style={{ width: 22, height: 22, border: "1px solid #262c37", borderRadius: 6, background: "#1a1f28", color: "#c9974a", fontSize: 14, fontWeight: 700, cursor: "pointer", padding: 0, lineHeight: 1 }}
              >
                +
              </button>
              <input
                value={book.learnedCount || 0}
                onChange={(e) => setLearnedCount(e.target.value)}
                inputMode="numeric"
                className="field"
                style={{ width: 42, fontSize: 14, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "5px 2px" }}
              />
              <span style={{ fontSize: 12, color: "#8993a6" }}>번</span>
            </div>
          </div>
        </div>

        <div style={{ marginBottom: 24, paddingBottom: 20, borderBottom: "1px solid #262c37" }}>
          <div style={{ fontSize: 12.5, color: "#8993a6", marginBottom: 8 }}>새 주요문 추가 (번호를 안 넣으면 자동으로 다음 번호가 매겨져요)</div>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, flexShrink: 0 }}>
              <input
                value={newQuoteNumber}
                onChange={(e) => setNewQuoteNumber(e.target.value)}
                placeholder="번호"
                inputMode="numeric"
                className="field"
                style={{ width: 46, fontSize: 16, textAlign: "center", padding: "6px 2px" }}
              />
              <label style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, cursor: "pointer" }}>
                <input
                  type="checkbox"
                  checked={splitByNumber}
                  onChange={(e) => setSplitByNumber(e.target.checked)}
                  style={{ width: 16, height: 16, accentColor: "#c9974a" }}
                />
                <span style={{ fontSize: 10, color: "#8993a6", whiteSpace: "nowrap" }}>번호나눔</span>
              </label>
            </div>
            <textarea
              value={newQuoteText}
              onChange={(e) => setNewQuoteText(e.target.value)}
              onBlur={addQuote}
              onPaste={handleNewQuotePaste}
              placeholder="내용을 입력하거나 붙여넣으세요 (메모에서 여러 줄을 붙여넣으면 자동으로 나뉘어 들어가요)"
              className="field"
              rows={3}
              style={{ flex: 1, fontSize: 17, color: "#e7eaf0", lineHeight: 1.6, resize: "vertical" }}
            />
          </div>
        </div>

        <div style={{ fontSize: 12, color: "#5a6274", marginBottom: 10 }}>내용을 지워서 비우면 그 항목이 삭제되고 번호가 다시 매겨져요</div>

        <input
          value={quoteSearchQuery}
          onChange={(e) => setQuoteSearchQuery(e.target.value)}
          placeholder="🔍 주요문 검색 (번호 또는 내용)"
          className="field"
          style={{ marginBottom: 14, fontSize: 15, padding: "8px 10px" }}
        />

        {filteredQuotes.map((q) => {
          const isBookmarked = q.id === book.bookmarkQuoteId;
          return (
          <div key={q.id} ref={(el) => { if (el) quoteRowRefs.current[q.id] = el; }}>
            <SwipeRow
              onNavigate={() => {}}
              actionWidth={112}
              content={
                <div style={{ display: "flex", gap: 6, alignItems: "flex-start", padding: "4px 6px", borderRadius: 10, background: isBookmarked ? "rgba(201,151,74,0.1)" : "transparent", boxSizing: "border-box", position: "relative" }}>
                  {isBookmarked && (
                    <svg style={{ position: "absolute", inset: 0, pointerEvents: "none" }} width="100%" height="100%">
                      <defs>
                        <linearGradient id={`bmGrad-${q.id}`} x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stopColor="#c9974a" />
                          <stop offset="55%" stopColor="#c9974a" />
                          <stop offset="64%" stopColor="#2a2a28" />
                          <stop offset="78%" stopColor="#5a5a5e" />
                          <stop offset="90%" stopColor="#c0392b" />
                          <stop offset="100%" stopColor="#c0392b" />
                        </linearGradient>
                      </defs>
                      <rect x="1" y="1" width="calc(100% - 2px)" height="calc(100% - 2px)" rx="9" ry="9" fill="none" stroke={`url(#bmGrad-${q.id})`} strokeWidth="2" />
                    </svg>
                  )}
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flexShrink: 0 }}>
                    <input
                      value={q.number}
                      onChange={(e) => updateQuoteNumber(q.id, e.target.value)}
                      inputMode="numeric"
                      className="field"
                      style={{ width: 32, fontSize: 14, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "4px 0" }}
                    />
                    <button
                      type="button"
                      onClick={() => toggleBookmark(q.id)}
                      style={{ width: 22, height: 22, border: "none", background: "none", padding: 0, cursor: "pointer", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}
                    >
                      <svg width="15" height="19" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1h14v18l-7-5-7 5V1z" fill={isBookmarked ? "#c9974a" : "#3a4150"} stroke={isBookmarked ? "#c9974a" : "#5a6274"} strokeWidth="1" strokeLinejoin="round" />
                      </svg>
                    </button>
                  </div>
                  <textarea
                    ref={(el) => { if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } }}
                    value={q.text}
                    onChange={(e) => {
                      updateQuoteText(q.id, e.target.value);
                      e.target.style.height = "auto";
                      e.target.style.height = e.target.scrollHeight + "px";
                    }}
                    className="field"
                    rows={1}
                    style={{ flex: 1, fontSize: 18, color: "#e7eaf0", lineHeight: 1.55, fontWeight: 600, resize: "none", overflow: "hidden", minHeight: 0, padding: "4px 8px" }}
                  />
                </div>
              }
              actions={(close) => (
                <>
                  <button
                    onClick={(e) => { e.stopPropagation(); close(); }}
                    style={{ flex: 1, border: "none", background: "#3a4150", color: "#e7eaf0", fontWeight: 700, fontSize: 12 }}
                  >
                    취소
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); onSnapshotUndo(); deleteQuoteById(q.id); }}
                    style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 12 }}
                  >
                    삭제
                  </button>
                </>
              )}
            />
          </div>
          );
        })}
      </div>
    </div>
  );
}

function SermonDetailView({ sermon, onBack, onUpdateSermon, preacherOptions, onSnapshotUndo, undo, undoCount }) {
  const [newQuoteNumber, setNewQuoteNumber] = useState("");
  const [newQuoteText, setNewQuoteText] = useState("");
  const [splitByNumber, setSplitByNumber] = useState(false);
  const [quoteSearchQuery, setQuoteSearchQuery] = useState("");
  const quoteRowRefs = useRef({});
  const fileInputRef = useRef(null);

  const persistQuotes = (next) => onUpdateSermon({ ...sermon, quotes: next });

  const renumberQuotes = (list) => [...list]
    .sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0))
    .map((q, idx) => ({ ...q, number: idx + 1 }));

  const addQuote = () => {
    const raw = newQuoteText;
    const text = raw.trim();
    if (!text) return;
    // 번호나눔이 켜져 있으면 번호 블록 단위로(다음 번호 전까지 한 개), 줄나눔이 켜져 있으면
    // 한 줄씩, 붙여넣기와 똑같은 방식으로 나눠서 주요문을 만든다.
    const splitParser = splitByNumber ? parseQuotesByNumberBlocks : null;
    if (splitParser && raw.includes("\n")) {
      const parsed = splitParser(raw);
      if (parsed.length > 1) {
        const acceptedTexts = sermon.quotes.map((q) => q.text);
        const uniqueImported = [];
        for (const t of parsed) {
          if (isDuplicateText(t, acceptedTexts)) continue;
          acceptedTexts.push(t);
          uniqueImported.push({ id: genId(), number: 0, text: t });
        }
        const skipped = parsed.length - uniqueImported.length;
        if (uniqueImported.length > 0) {
          persistQuotes([...sermon.quotes, ...uniqueImported].map((q, idx) => ({ ...q, number: idx + 1 })));
        }
        setNewQuoteNumber("");
        setNewQuoteText("");
        if (skipped > 0) alert(`${uniqueImported.length}개를 추가했어요. (80% 이상 비슷한 내용 ${skipped}개 제외)`);
        return;
      }
    }
    if (isDuplicateText(text, sermon.quotes.map((q) => q.text))) {
      setNewQuoteNumber("");
      setNewQuoteText("");
      alert("기존 주요문과 80% 이상 비슷한 내용이라 기존 내용을 그대로 두고 추가하지 않았어요.");
      return;
    }
    const maxNum = sermon.quotes.reduce((m, q) => Math.max(m, num(q.number) || 0), 0);
    const number = newQuoteNumber.trim() ? num(newQuoteNumber) : maxNum + 1;
    persistQuotes([...sermon.quotes, { id: genId(), number, text }]);
    setNewQuoteNumber("");
    setNewQuoteText("");
  };

  // 삭제할 때 화면이 튀지 않도록, 삭제 직후 스크롤 위치를 원래 자리로 고정한다.
  const deleteQuoteById = (id) => {
    const scrollY = window.scrollY;
    persistQuotes(sermon.quotes.filter((q) => q.id !== id));
    const restore = () => window.scrollTo(0, scrollY);
    requestAnimationFrame(() => { restore(); requestAnimationFrame(restore); });
  };

  const updateQuoteNumber = (id, value) => {
    // "1+2+3"처럼 +로 여러 번호를 적으면, 그 번호들의 내용을 순서대로 합쳐서 맨 앞 번호(예: 1) 하나로 만든다.
    if (value.includes("+")) {
      const parts = value.split("+").map((s) => s.trim()).filter(Boolean);
      if (parts.length > 1) {
        const targets = parts.map((p) => sermon.quotes.find((q) => String(q.number) === p)).filter(Boolean);
        if (targets.length > 1) {
          onSnapshotUndo();
          const mergedText = targets.map((q) => q.text).join("\n");
          const keepId = targets[0].id;
          const mergedNumber = targets[0].number;
          const removeIds = new Set(targets.slice(1).map((q) => q.id));
          const next = sermon.quotes
            .filter((q) => !removeIds.has(q.id))
            .map((q) => (q.id === keepId ? { ...q, text: mergedText, number: mergedNumber } : q));
          persistQuotes(next);
          return;
        }
      }
    }
    // 번호를 바꿔도 목록에서의 위치(줄)는 그대로 두고, 그 항목의 번호 표시만 바꾼다.
    persistQuotes(sermon.quotes.map((q) => (q.id === id ? { ...q, number: value.trim() === "" ? value : num(value) } : q)));
  };

  const updateQuoteText = (id, value) => {
    if (value.trim() === "") {
      onSnapshotUndo();
      // 지워서 삭제할 때도 남은 항목들의 번호는 그대로 두고(다시 매기지 않고) 그 줄만 뺀다.
      deleteQuoteById(id);
      return;
    }
    persistQuotes(sermon.quotes.map((q) => (q.id === id ? { ...q, text: value } : q)));
  };

  const toggleBookmark = (id) => {
    onUpdateSermon({ ...sermon, bookmarkQuoteId: sermon.bookmarkQuoteId === id ? null : id });
  };

  const jumpToBookmark = () => {
    const node = sermon.bookmarkQuoteId && quoteRowRefs.current[sermon.bookmarkQuoteId];
    if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const setLearnedCount = (v) => {
    const n = Number(v);
    onUpdateSermon({ ...sermon, learnedCount: Number.isFinite(n) && n >= 0 ? n : 0 });
  };

  const fileBaseName = () => sermon.title && sermon.title.trim() ? sermon.title : sermon.date;

  const exportToExcel = () => {
    XLSX.writeFile(buildQuotesWorkbook(fileBaseName(), sermon.quotes), buildFileName(fileBaseName()));
  };

  const shareToNotes = async () => {
    const text = buildQuotesPlainText(fileBaseName(), sermon.quotes);
    if (navigator.share) {
      try { await navigator.share({ title: fileBaseName() || "주요문", text }); } catch (e) {}
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      alert("이 기기에서는 공유시트를 지원하지 않아 대신 클립보드에 복사했어요. 메모 앱을 열어 붙여넣어주세요.");
    } catch (e) {
      alert("공유하거나 복사하지 못했어요.");
    }
  };

  const importFromNotesText = (rawText) => {
    const lines = rawText.split(/\r?\n/);
    let title = null;
    let bodyText = rawText;
    if (lines.length > 1 && lines[0].trim() && lines[1] !== undefined && lines[1].trim() === "") {
      title = lines[0].trim();
      bodyText = lines.slice(2).join("\n");
    }
    const splitParser = parseQuotesByNumberBlocks;
    const parsed = splitParser(bodyText);
    if (parsed.length === 0) return false;
    const acceptedTexts = sermon.quotes.map((q) => q.text);
    const uniqueImported = [];
    for (const text of parsed) {
      if (isDuplicateText(text, acceptedTexts)) continue;
      acceptedTexts.push(text);
      uniqueImported.push({ id: genId(), number: 0, text });
    }
    const skipped = parsed.length - uniqueImported.length;
    const finalQuotes = uniqueImported.length > 0
      ? [...sermon.quotes, ...uniqueImported].map((q, idx) => ({ ...q, number: idx + 1 }))
      : sermon.quotes;
    // 제목 변경과 주요문 추가를 한 번의 업데이트로 같이 반영한다.
    onUpdateSermon({ ...sermon, quotes: finalQuotes, ...(title ? { title } : {}) });
    alert(`${uniqueImported.length}개를 가져왔어요.${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}${title ? ` 제목도 "${title}"(으)로 반영했어요.` : ""}`);
    return true;
  };

  const handleNewQuotePaste = (e) => {
    if (!splitByNumber) return; // 번호나눔이 꺼져있으면 기본 붙여넣기 그대로(한 칸에 전부 들어감)
    const pasted = e.clipboardData ? e.clipboardData.getData("text") : "";
    if (!pasted || !pasted.includes("\n")) return;
    e.preventDefault();
    const handled = importFromNotesText(pasted);
    if (!handled) setNewQuoteText((prev) => prev + pasted);
  };

  // 제목 칸은 한 줄짜리 입력창이라 여러 줄을 그대로 붙여넣으면 브라우저가 첫 줄만 남기고
  // 나머지를 버린다. 제목 칸에 붙여넣을 때는 첫 줄은 제목으로, 나머지는 주요문으로 나눠 넣는다.
  const handleTitlePaste = (e) => {
    const pasted = e.clipboardData ? e.clipboardData.getData("text") : "";
    if (!pasted || !pasted.includes("\n")) return;
    e.preventDefault();
    const lines = pasted.split(/\r?\n/);
    const firstIdx = lines.findIndex((l) => l.trim());
    if (firstIdx === -1) return;
    const title = lines[firstIdx].trim();
    let bodyLines = lines.slice(firstIdx + 1);
    if (bodyLines[0] !== undefined && bodyLines[0].trim() === "") bodyLines = bodyLines.slice(1);
    const splitParser = parseQuotesByNumberBlocks;
    const parsed = splitParser(bodyLines.join("\n"));
    const acceptedTexts = sermon.quotes.map((q) => q.text);
    const uniqueImported = [];
    for (const text of parsed) {
      if (isDuplicateText(text, acceptedTexts)) continue;
      acceptedTexts.push(text);
      uniqueImported.push({ id: genId(), number: 0, text });
    }
    const skipped = parsed.length - uniqueImported.length;
    const finalQuotes = uniqueImported.length > 0
      ? [...sermon.quotes, ...uniqueImported].map((q, idx) => ({ ...q, number: idx + 1 }))
      : sermon.quotes;
    onUpdateSermon({ ...sermon, quotes: finalQuotes, title });
    alert(`제목을 "${title}"(으)로 반영했어요.${uniqueImported.length > 0 ? ` 주요문 ${uniqueImported.length}개도 가져왔어요.` : ""}${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}`);
  };

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];

        // 한 열에 "2026년9월6일 / 제목 : ... / 성경 : ... / 강사 : ... / 1. 내용 / 2. 내용 ..." 처럼
        // 줄 단위로 정리된 설교 노트 형식인지 먼저 확인한다.
        const raw2d = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const firstCells = raw2d.slice(0, 8).map((r) => String((r && r[0]) ?? "").trim());
        const looksLikeSermonNote =
          firstCells.some((c) => /^제목\s*[:：]/.test(c)) ||
          firstCells.some((c) => /^성경\s*[:：]/.test(c)) ||
          firstCells.some((c) => /^강사\s*[:：]/.test(c));

        let imported = [];
        let fieldUpdates = null;

        if (looksLikeSermonNote) {
          let title = null, scripture = null, preacher = null, dateStr = null;
          const contentLines = [];
          for (const r of raw2d) {
            const cell = String((r && r[0]) ?? "");
            const trimmed = cell.trim();
            if (!trimmed) continue;
            let m;
            if ((m = trimmed.match(/^제목\s*[:：]\s*(.*)$/))) { title = m[1].trim(); continue; }
            if ((m = trimmed.match(/^성경\s*[:：]\s*(.*)$/))) { scripture = m[1].trim(); continue; }
            if ((m = trimmed.match(/^강사\s*[:：]\s*(.*)$/))) { preacher = m[1].trim(); continue; }
            if ((m = trimmed.match(/^(\d{4})[년.\-\/](\d{1,2})[월.\-\/](\d{1,2})\s*일?$/))) {
              dateStr = `${m[1]}-${pad2(Number(m[2]))}-${pad2(Number(m[3]))}`;
              continue;
            }
            const normalized = cell.replace(/\t/g, " ").replace(/\s+/g, " ").trim();
            if (normalized) contentLines.push(normalized);
          }
          imported = contentLines
            .map((line) => {
              const { text } = splitLeadingNumber(line);
              return { id: genId(), number: 0, text };
            })
            .filter((q) => q.text)
            .map((q, idx) => ({ ...q, number: idx + 1 }));
          fieldUpdates = {};
          if (dateStr) fieldUpdates.date = dateStr;
          if (title) fieldUpdates.title = title;
          if (scripture) fieldUpdates.scripture = scripture;
          if (preacher) fieldUpdates.preacher = preacher;
        } else {
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          imported = rows
            .map((row) => {
              const rawText = String(row["주요문"] ?? row["명언"] ?? row["내용"] ?? Object.values(row)[1] ?? "").trim();
              const { leadingNumber, text } = splitLeadingNumber(rawText);
              const numberRaw = row["번호"] ?? Object.values(row)[0];
              const number = num(numberRaw) || leadingNumber || 0;
              return { id: genId(), number, text };
            })
            .filter((q) => q.text);
        }

        if (imported.length === 0) {
          alert("엑셀에서 읽을 수 있는 내용이 없어요.");
          return;
        }
        const acceptedTexts = sermon.quotes.map((q) => q.text);
        const uniqueImported = [];
        for (const q of imported) {
          if (isDuplicateText(q.text, acceptedTexts)) continue;
          acceptedTexts.push(q.text);
          uniqueImported.push(q);
        }
        const skipped = imported.length - uniqueImported.length;
        if (uniqueImported.length === 0 && !fieldUpdates) {
          alert("가져올 새 내용이 없어요 (전부 이미 있는 내용과 80% 이상 비슷해요).");
          return;
        }
        const merged = [...sermon.quotes, ...uniqueImported].sort((a, b) => (num(a.number) || 0) - (num(b.number) || 0));
        const renumbered = merged.map((q, idx) => ({ ...q, number: idx + 1 }));
        onUpdateSermon({ ...sermon, ...(fieldUpdates || {}), quotes: renumbered });
        alert(`${uniqueImported.length}개를 가져왔어요.${skipped > 0 ? ` (80% 이상 비슷한 내용 ${skipped}개 제외)` : ""}${fieldUpdates ? " 날짜/제목/성경/강사도 함께 채웠어요." : ""}`);
      } catch (err) {
        alert("엑셀 파일을 읽지 못했어요: " + (err.message || err));
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const filteredQuotes = sermon.quotes
    .filter((q) => {
      const query = quoteSearchQuery.trim().toLowerCase();
      if (!query) return true;
      return q.text.toLowerCase().includes(query) || String(q.number).includes(query);
    });
    // 번호로 다시 정렬하지 않는다 — 목록 순서는 저장된 순서(줄) 그대로 유지한다.

  return (
    <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 10px) 0 0" }}>
      <div style={{ padding: "0 10px 10px", position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20, background: "#12151b", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, flexWrap: "wrap" }}>
        <button onClick={onBack} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 14 }}>← 뒤로</button>
        <div style={{ display: "flex", gap: 6 }}>
          <input type="file" accept=".xlsx,.xls" ref={fileInputRef} onChange={handleImportFile} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬆ 가져오기</button>
          <button onClick={exportToExcel} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬇ 내려받기</button>
          <button onClick={jumpToBookmark} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>📍 책갈피로</button>
          <button onClick={shareToNotes} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>📤 메모내보내기</button>
          <button
            onClick={undo}
            disabled={undoCount === 0}
            className="iconbtn"
            style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
          >
            ↺{undoCount > 0 ? ` ${undoCount}` : ""}
          </button>
        </div>
      </div>
      <div style={{ padding: "0 8px 40px" }}>
        <div style={{ marginBottom: 16, display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 17, fontWeight: 700, color: "#8993a6", flexShrink: 0, width: 40 }}>날짜</span>
            <input
              type="date"
              value={sermon.date}
              onChange={(e) => onUpdateSermon({ ...sermon, date: e.target.value })}
              className="field"
              style={{ width: "33%", flexShrink: 0, fontSize: 18, fontWeight: 700, color: "#c9974a", padding: "9px 10px" }}
            />
            <input
              value={quoteSearchQuery}
              onChange={(e) => setQuoteSearchQuery(e.target.value)}
              placeholder="🔍 주요문 검색"
              className="field"
              style={{ flex: 1, minWidth: 0, fontSize: 16, padding: "9px 10px" }}
            />
          </div>

function SermonListView({ sermons, onOpenSermon, onDeleteSermon, newSermonDate, onChangeNewSermonDate, onAddSermon, onBackToReading, undo, undoCount, onImport, onExport, fileInputRef, rowRefs, bookmarkedId, onToggleBookmark, onJumpToBookmark, label, onChangeLabel }) {
  const [searchQuery, setSearchQuery] = useState("");
  const sorted = [...sermons]
    .filter((s) => {
      const q = searchQuery.trim().toLowerCase();
      if (!q) return true;
      return (s.title || "").toLowerCase().includes(q) || (s.scripture || "").toLowerCase().includes(q) || s.quotes.some((qq) => qq.text.toLowerCase().includes(q));
    })
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); // 최근 날짜가 먼저

  const fmtDate = (ds) => {
    if (!ds) return ds;
    const d = parseLocalDate(ds);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    return `${ds} (${days[d.getDay()]})`;
  };

  return (
    <div>
    <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px", position: "sticky", top: 0, zIndex: 20, background: "#12151b", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, flexWrap: "wrap" }}>
        <button onClick={onBackToReading} className="iconbtn" style={{ color: "#c9974a", fontWeight: 700, fontSize: 13 }}>← 홈으로</button>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          <input type="file" accept=".xlsx,.xls" ref={fileInputRef} onChange={onImport} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬆ 가져오기</button>
          <button onClick={onExport} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>⬇ 내려받기</button>
          <button onClick={onJumpToBookmark} className="iconbtn" style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: "#c9974a", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 4 }}>
            <svg width="11" height="14" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg"><path d="M1 1h14v18l-7-5-7 5V1z" fill="#c9974a" stroke="#c9974a" strokeWidth="1" strokeLinejoin="round" /></svg>
            책갈피로
          </button>
          <button
            onClick={undo}
            disabled={undoCount === 0}
            className="iconbtn"
            style={{ padding: "6px 9px", borderRadius: 8, border: "1px solid #262c37", background: "#1a1f28", color: undoCount > 0 ? "#c9974a" : "#4a5060", fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap", opacity: undoCount > 0 ? 1 : 0.5 }}
          >
            ↺{undoCount > 0 ? ` ${undoCount}` : ""}
          </button>
        </div>
    </div>
    <div style={{ padding: "0 16px 20px" }}>
      <div style={{ fontSize: 33, fontWeight: 800, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
        <span>⛪</span>
        <input
          value={label}
          onChange={(e) => onChangeLabel(e.target.value)}
          style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", fontSize: 33, fontWeight: 800, color: "#e7eaf0", padding: 0 }}
        />
      </div>
      <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 12 }}>
        매주 일요일 날짜가 자동으로 추가돼요(앱을 열 때 그 사이 빠진 주를 채워 넣어요). 필요하면 날짜를 직접 추가할 수도 있어요. 박스를 왼쪽으로 밀면 삭제/취소를 선택할 수 있어요.
      </div>

      <input
        value={searchQuery}
        onChange={(e) => setSearchQuery(e.target.value)}
        placeholder="🔍 주요문 검색 (제목/성경/내용)"
        className="field"
        style={{ marginBottom: 14, fontSize: 14, padding: "8px 10px" }}
      />

      {sorted.length === 0 && (
        <div style={{ textAlign: "center", color: "#8993a6", fontSize: 13, padding: "40px 0" }}>아직 등록된 설교가 없어요.</div>
      )}

      {sorted.map((s, idx) => (
        <div key={s.id} ref={(el) => { if (el) rowRefs.current[s.id] = el; }} style={{ display: "flex", gap: 6, alignItems: "flex-start", marginBottom: 10 }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, flexShrink: 0, paddingTop: 2 }}>
            <div className="field" style={{ width: 30, fontSize: 13, fontWeight: 700, color: "#c9974a", textAlign: "center", padding: "4px 0" }}>{idx + 1}</div>
            <button type="button" onClick={() => onToggleBookmark(s.id)} style={{ width: 22, height: 22, border: "none", background: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg width="15" height="19" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1h14v18l-7-5-7 5V1z" fill={bookmarkedId === s.id ? "#c9974a" : "#3a4150"} stroke={bookmarkedId === s.id ? "#c9974a" : "#5a6274"} strokeWidth="1" strokeLinejoin="round" />
              </svg>
            </button>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <SwipeRow
              onNavigate={() => onOpenSermon(s.id)}
              content={
                <div style={{ background: "#1a1f28", border: "1px solid #262c37", borderRadius: 12, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 13, color: "#c9974a", fontWeight: 700 }}>{fmtDate(s.date)}</div>
                    <div style={{ fontSize: 19, fontWeight: 700, color: "#e7eaf0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginTop: 2 }}>
                      {s.title && s.title.trim() ? s.title : "(제목 없음)"}
                    </div>
                    <div style={{ fontSize: 12, color: "#8993a6", marginTop: 4 }}>
                      {s.scripture ? `${s.scripture} · ` : ""}{s.preacher || DEFAULT_PREACHER} · 주요문 {s.quotes.length}개 · 익힘 {s.learnedCount || 0}번
                    </div>
                  </div>
                  <div style={{ color: "#8993a6", fontSize: 18, flexShrink: 0 }}>›</div>
                </div>
              }
              actions={(close) => (
                <>
                  <button
                    onClick={(e) => { e.stopPropagation(); close(); }}
                    style={{ flex: 1, border: "none", background: "#3a4150", color: "#e7eaf0", fontWeight: 700, fontSize: 13 }}
                  >
                    취소
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); onDeleteSermon(s.id); }}
                    style={{ flex: 1, border: "none", background: "#e8544b", color: "#fff", fontWeight: 700, fontSize: 13 }}
                  >
                    삭제
                  </button>
                </>
              )}
            />
          </div>
        </div>
      ))}

      <div style={{ marginTop: 6 }}>
        <div style={{ fontSize: 12, color: "#8993a6", marginBottom: 8 }}>날짜를 직접 추가하기</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input
            type="date"
            value={newSermonDate}
            onChange={(e) => onChangeNewSermonDate(e.target.value)}
            className="field"
            style={{ flex: 1, fontSize: 14, padding: "10px 12px" }}
          />
          <button
            onClick={onAddSermon}
            className="iconbtn"
            style={{ border: "1px solid #c9974a", background: "rgba(201,151,74,0.12)", color: "#c9974a", fontWeight: 700, fontSize: 13, borderRadius: 10, padding: "0 16px", whiteSpace: "nowrap" }}
          >
            + 추가
          </button>
        </div>
      </div>
    </div>
    </div>
  );
}
